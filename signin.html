<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Training OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230B0F14' stroke='%232F80FF' stroke-width='6'/><path d='M25 65 L40 35 L55 52 L70 25' stroke='%232F80FF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="dashboard-page">

  <div class="iphone-frame">

    <div class="iphone-notch">
      <div class="iphone-notch-inner"></div>
    </div>

    <div class="iphone-screen">
      <div class="screen active">

        <div class="setup-screen">

          <div class="setup-screen-header">
            <p class="setup-os-label">Training OS</p>
            <h2 class="setup-screen-title">Welcome<br/>Back</h2>
            <p class="setup-screen-sub">Sign in to your account.</p>
          </div>

          <div class="setup-form">

            <div class="setup-field">
              <label class="setup-field-label">Email</label>
              <input class="setup-field-input" type="email" id="email" placeholder="alex@example.com" autocomplete="off" />
            </div>

            <div class="setup-field">
              <label class="setup-field-label">Password</label>
              <input class="setup-field-input" type="password" id="password" placeholder="Your password" />
            </div>

            <div class="setup-error hidden" id="setupError"></div>

            <button class="setup-btn-primary" id="signinBtn" onclick="handleSignin()">Sign In</button>

            <a href="signup.html" class="setup-link">Don't have an account? Sign up free</a>

          </div>

        </div>

      </div>
    </div>

    <div class="iphone-home-btn" onclick="window.location.href='index.html'">
      <div class="iphone-home-btn-inner"></div>
    </div>

  </div>

  <script>
    async function handleSignin() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn      = document.getElementById("signinBtn");

      if (!email || !password) {
        showError("Please fill in all fields.");
        return;
      }

      btn.textContent = "Signing in…";
      btn.disabled = true;

      try {
        const res = await fetch("/api/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error);
          btn.textContent = "Sign In";
          btn.disabled = false;
          return;
        }
        localStorage.setItem("token", data.token);
        localStorage.setItem("userName", data.name);
        localStorage.setItem("userId", data.id);
        localStorage.setItem("hasCompletedOnboarding", data.hasCompletedOnboarding);

        if (data.hasCompletedOnboarding) {
          window.location.href = "dashboard.html";
        } else {
          window.location.href = "onboarding.html";
        }
      } catch (err) {
        showError("Something went wrong. Please try again.");
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    }

    function showError(msg) {
      const el = document.getElementById("setupError");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSignin();
    });
  </script>

</body>
</html>
