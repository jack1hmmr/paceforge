<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaceForge — Training OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230B0F14' stroke='%232F80FF' stroke-width='6'/><path d='M25 65 L40 35 L55 52 L70 25' stroke='%232F80FF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="dashboard-page">

  <div class="iphone-frame">

    <div class="iphone-notch">
      <div class="iphone-notch-inner"></div>
    </div>

    <div class="iphone-screen">
      <div class="screen active" id="screenHello">

        <!-- Background -->
        <div class="lock-bg"></div>

        <!-- Hello content -->
        <div class="setup-hello">
          <p class="setup-os-label">Training OS</p>
          <h1 class="setup-hello-text">Hello.</h1>
          <p class="setup-tagline">Your AI-powered running coach</p>
        </div>

        <!-- Bottom buttons -->
        <div class="setup-bottom">
          <a href="signup.html" class="setup-btn-primary">Get Started</a>
          <a href="signin.html" class="setup-btn-secondary">Sign In</a>
        </div>

      </div>
    </div>

    <div class="iphone-home-btn" onclick="window.location.href='signup.html'">
      <div class="iphone-home-btn-inner"></div>
    </div>

  </div>

  <script>
    if (localStorage.getItem("token")) {
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
