<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaceForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230B0F14' stroke='%232F80FF' stroke-width='6'/><path d='M50 20 Q70 50 50 80 Q30 50 50 20' fill='%232F80FF'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="dashboard-page">

  <div class="iphone-frame">
    <div class="iphone-notch">
      <div class="iphone-notch-inner"></div>
    </div>

    <div class="iphone-screen">
      <!-- LOCK SCREEN -->
      <div class="screen active" id="screenLock">
        <div class="lock-bg"></div>
        <div class="lock-time" id="lockTime">9:41</div>
        <div class="lock-date" id="lockDate">Saturday, March 28</div>
        <div class="lock-hint">Swipe up to unlock</div>
        <div class="lock-swipe-area" onclick="goHome()"></div>
      </div>

      <!-- HOME SCREEN -->
      <div class="screen" id="screenHome">
        <div class="home-wallpaper"></div>
        <div class="status-bar">
          <span id="homeTime">9:41</span>
          <div class="status-icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
              <rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
              <rect x="1" y="3" width="12" height="7" rx="2" stroke="white" stroke-width="1.5" fill="none"/><rect x="13.5" y="5" width="1.5" height="3" rx="0.5" fill="white"/><rect x="2.5" y="4.5" width="7" height="4" rx="1" fill="white"/>
            </svg>
          </div>
        </div>

        <div class="app-grid">
          <div class="app-icon" onclick="openApp('training')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #1a6fff, #0a3d9e)">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M5 20 L10 12 L15 17 L20 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="8" r="2.5" fill="white"/>
              </svg>
            </div>
            <span class="app-label">Training</span>
          </div>

          <div class="app-icon" onclick="openApp('coach')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #27ae60, #1a7a42)">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M6 8h16a2 2 0 012 2v8a2 2 0 01-2 2H8l-4 3V10a2 2 0 012-2z" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="app-label">AI Coach</span>
          </div>

          <div class="app-icon" onclick="openApp('checkin')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #f4530c, #b33a08)">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect x="6" y="4" width="16" height="20" rx="2" stroke="white" stroke-width="2" fill="none"/><path d="M10 12h8M10 16h5" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="9" r="1.5" fill="white"/>
              </svg>
            </div>
            <span class="app-label">Check-in</span>
          </div>

          <div class="app-icon" onclick="openApp('progress')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #9b59b6, #6c3483)">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M5 20h18M8 20v-6M12 20v-10M16 20v-4M20 20v-8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="app-label">Progress</span>
          </div>

          <div class="app-icon" onclick="openApp('store')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #e67e22, #a04000)">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M6 8h16l-2 10H8L6 8z" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M10 8V6a4 4 0 018 0v2" stroke="white" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="app-label">Store</span>
          </div>

          <div class="app-icon" onclick="openApp('settings')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #555, #333)">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="3.5" stroke="white" stroke-width="2"/><path d="M14 4v3M14 21v3M4 14h3M21 14h3M6.9 6.9l2.1 2.1M19 19l2.1 2.1M6.9 21.1l2.1-2.1M19 9l2.1-2.1" stroke="white" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="app-label">Settings</span>
          </div>
        </div>

        <div class="iphone-dock">
          <div class="app-icon" onclick="openApp('training')">
            <div class="app-icon-img" style="background: linear-gradient(135deg, #1a6fff, #0a3d9e)">
              <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
                <path d="M5 20 L10 12 L15 17 L20 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="8" r="2.5" fill="white"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- TRAINING APP -->
      <div class="screen" id="screenTraining">
        <div class="app-screen">
          <div class="app-topbar">
            <button class="app-back-btn" onclick="goHome()">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M11 4l-6 5 6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <span class="app-topbar-title">Training Plan</span>
            <span class="nav-badge" id="trainingBadge">0%</span>
          </div>

          <div class="app-content" id="trainingContent">
            <div class="phase-bar" id="appPhaseBar"></div>
            <div class="week-nav" id="appWeekNav">
              <button class="week-nav-btn" onclick="changeWeek(-1)">
                <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                  <path d="M11 4l-6 5 6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="week-nav-center">
                <span class="week-nav-label" id="appWeekLabel">Week 1</span>
                <span class="week-nav-phase" id="appWeekPhase">Base</span>
                <span class="week-nav-focus" id="appWeekFocus"></span>
              </div>
              <button class="week-nav-btn" onclick="changeWeek(1)">
                <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                  <path d="M7 4l6 5-6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>

            <div class="loading-state" id="appLoading">
              <div class="loading-pulse">
                <div class="pulse-ring"></div>
                <div class="pulse-core">
                  <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
                    <path d="M7 18 L13 10 L17 15 L22 7" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <p class="loading-title" style="font-size:1.2rem">Loading…</p>
            </div>

            <div class="error-state hidden" id="appError">
              <p class="error-title" style="font-size:1.2rem">⚠️ Couldn't load plan</p>
              <p class="error-sub" id="appErrorMsg"></p>
              <button class="retry-button" onclick="loadPlan()">Retry</button>
            </div>

            <div class="plan-grid hidden" id="appPlanGrid"></div>

            <div class="week-summary hidden" id="appWeekSummary">
              <div class="summary-item">
                <span class="summary-label">Miles</span>
                <span class="summary-value" id="appSummaryMiles">—</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Done</span>
                <span class="summary-value" id="appSummaryDone">0/7</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Phase</span>
                <span class="summary-value" id="appSummaryPhase">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- AI COACH APP -->
      <div class="screen" id="screenCoach">
        <div class="app-screen">
          <div class="app-topbar">
            <button class="app-back-btn" onclick="goHome()">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M11 4l-6 5 6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div style="flex:1">
              <div class="app-topbar-title">AI Coach</div>
              <div style="font-size:0.65rem;color:var(--success)">● Online</div>
            </div>
          </div>
          <div class="coach-window" id="coachWindow"></div>
          <div class="coach-inputbar">
            <input type="text" class="imessage-input" id="coachInput" placeholder="Ask your coach..." autocomplete="off" />
            <button class="imessage-send" id="coachSendBtn" onclick="sendCoachMessage()">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M9 15V3M9 3L4 8M9 3L14 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- MODAL FOR PLAN CHANGE CONFIRMATION -->
      <div class="modal hidden" id="planChangeModal">
        <div class="modal-content">
          <h3>Plan Change Request</h3>
          <p id="modalMessage"></p>
          <div class="modal-buttons">
            <button class="modal-btn cancel" onclick="rejectPlanChange()">Decline</button>
            <button class="modal-btn approve" onclick="approvePlanChange()">Approve</button>
          </div>
        </div>
      </div>
    </div>

    <div class="iphone-home-btn" onclick="goHome()">
      <div class="iphone-home-btn-inner"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast">
    <div class="toast-icon">✓</div>
    <div class="toast-text">
      <strong id="toastTitle">Done!</strong>
      <span id="toastSub">Keep going.</span>
    </div>
  </div>

  <script>
    // ============================================================
    // GLOBAL VARS
    // ============================================================
    let fullPlan = null;
    let currentWeek = 1;
    let completedWorkouts = {};
    let pendingPlanChange = null;

    // ============================================================
    // TIME
    // ============================================================
    function updateTime() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes().toString().padStart(2, "0");
      const timeStr = `${h}:${m}`;
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const dateStr = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      document.getElementById("lockTime").textContent = timeStr;
      document.getElementById("lockDate").textContent = dateStr;
      document.getElementById("homeTime").textContent = timeStr;
    }
    updateTime();
    setInterval(updateTime, 1000);

    document.getElementById("coachInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendCoachMessage();
    });

    // ============================================================
    // SCREEN NAVIGATION
    // ============================================================
    let currentScreen = "screenLock";

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      currentScreen = id;
    }

    function goHome() {
      showScreen("screenHome");
    }

    function openApp(app) {
      const map = {
        training: "screenTraining",
        coach:    "screenCoach",
        checkin:  "screenCheckin",
        progress: "screenProgress",
        store:    "screenStore",
        settings: "screenSettings",
      };
      if (map[app]) {
        showScreen(map[app]);
        if (app === "training" && !fullPlan) loadPlan();
        if (app === "coach") initCoach();
      }
    }

    function signOut() {
      localStorage.clear();
      window.location.href = "index.html";
    }

    // ============================================================
    // TRAINING APP
    // ============================================================
    async function loadPlan() {
      show("appLoading");
      hide("appError");
      hide("appPlanGrid");
      hide("appWeekSummary");
      hide("appPhaseBar");
      hide("appWeekNav");

      try {
        const token = localStorage.getItem("token");
        if (!token) { window.location.href = "signin.html"; return; }

        const res = await fetch("/api/plan", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || "Could not load plan");
        }

        fullPlan = await res.json();
        await loadCompletedWorkouts();

        document.getElementById("appWeekLabel").textContent = `Week 1 of ${fullPlan.totalWeeks}`;
        currentWeek = 1;
        buildPhaseBar();

        hide("appLoading");
        show("appPhaseBar");
        show("appWeekNav");
        show("appWeekSummary");

        renderWeek(currentWeek);

      } catch (err) {
        hide("appLoading");
        show("appError");
        document.getElementById("appErrorMsg").textContent = err.message;
      }
    }

    function buildPhaseBar() {
      if (!fullPlan.phases) return;
      const bar = document.getElementById("appPhaseBar");
      bar.innerHTML = "";
      const colors = { Base: "#3ecf8e", Build: "#ffb347", Peak: "#f4530c", Taper: "#888" };
      fullPlan.phases.forEach(phase => {
        const width = ((phase.weekEnd - phase.weekStart + 1) / fullPlan.totalWeeks) * 100;
        const div = document.createElement("div");
        div.className = "phase-segment";
        div.style.width = width + "%";
        div.style.background = colors[phase.name] || "#444";
        div.innerHTML = `<span>${phase.name}</span>`;
        div.onclick = () => renderWeek(phase.weekStart);
        bar.appendChild(div);
      });
    }

    function renderWeek(weekNum) {
      currentWeek = weekNum;
      const weekData = fullPlan.weeks.find(w => w.week === weekNum);
      if (!weekData) return;

      document.getElementById("appWeekLabel").textContent = `Week ${weekNum} of ${fullPlan.totalWeeks}`;
      document.getElementById("appWeekPhase").textContent = weekData.phase || "";
      document.getElementById("appWeekFocus").textContent = weekData.focus || "";
      document.getElementById("appSummaryMiles").textContent = weekData.totalMiles ? weekData.totalMiles + " mi" : "—";
      document.getElementById("appSummaryPhase").textContent = weekData.phase || "—";

      const grid = document.getElementById("appPlanGrid");
      grid.innerHTML = "";
      show("appPlanGrid");

      weekData.days.forEach((day, index) => {
        const dayName = day.name || `Day ${index + 1}`;
        const dayShort = dayName.substring(0, 3).toUpperCase();
        const workout = day.workout || "Rest";
        const type = day.type || "";
        const key = `${weekNum}-${dayName}`;
        const isDone = completedWorkouts[key] === true;

        const card = document.createElement("div");
        card.className = "workout-card" + (isDone ? " completed" : "");

        const typeColors = {
          "Easy Run": "#3ecf8e", "Long Run": "#ffb347", "Workout": "#f4530c",
          "Tempo": "#f4530c", "Intervals": "#f4530c", "Cross Training": "#4a9eff",
          "Rest": "#444", "Recovery": "#3ecf8e"
        };
        const typeColor = typeColors[type] || "#888";

        card.innerHTML = `
          <div class="day-label">
            <span class="day-name">${dayShort}</span>
            <span class="day-num" style="color:${typeColor}">${type}</span>
          </div>
          <div class="workout-info">
            <p class="workout-text">${escapeHtml(workout)}</p>
          </div>
          <button class="complete-btn" onclick="markComplete(this,'${escapeHtml(dayName)}',${weekNum})">Done</button>
          <div class="completed-check">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 7l4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        `;
        grid.appendChild(card);
      });

      updateWeekProgress(weekNum, weekData.days.length);
      updateOverallProgress();
    }

    function changeWeek(dir) {
      if (!fullPlan) return;
      const n = currentWeek + dir;
      if (n < 1 || n > fullPlan.totalWeeks) return;
      renderWeek(n);
      document.getElementById("trainingContent").scrollTop = 0;
    }

    async function markComplete(btn, dayName, weekNum) {
      const card = btn.closest(".workout-card");
      if (card.classList.contains("completed")) return;
      card.classList.add("completed");
      const key = `${weekNum}-${dayName}`;
      completedWorkouts[key] = true;

      try {
        const token = localStorage.getItem("token");
        await fetch("/api/log-workout", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ weekNumber: weekNum, dayName })
        });
      } catch(e) {}

      const weekData = fullPlan.weeks.find(w => w.week === weekNum);
      updateWeekProgress(weekNum, weekData?.days.length || 7);
      updateOverallProgress();
      showToast(`${dayName} complete! 🏃`, "Keep building momentum.");
    }

    async function loadCompletedWorkouts() {
      try {
        const token = localStorage.getItem("token");
        const res = await fetch("/api/workout-logs", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const logs = await res.json();
        logs.forEach(log => {
          completedWorkouts[`${log.week_number}-${log.day_name}`] = true;
        });
      } catch(e) {}
    }

    function updateWeekProgress(weekNum, totalDays) {
      const done = Object.keys(completedWorkouts).filter(k => k.startsWith(`${weekNum}-`)).length;
      document.getElementById("appSummaryDone").textContent = `${done}/${totalDays}`;
    }

    function updateOverallProgress() {
      if (!fullPlan) return;
      const total = fullPlan.totalWeeks * 7;
      const done = Object.keys(completedWorkouts).length;
      const pct = Math.round((done / total) * 100);
      document.getElementById("trainingBadge").textContent = pct + "%";
    }

    // ============================================================
    // AI COACH
    // ============================================================
    let coachInitialized = false;

    async function initCoach() {
      if (coachInitialized) return;
      coachInitialized = true;
      const userName = localStorage.getItem("userName") || "Athlete";
      const firstName = userName.split(" ")[0];
      addCoachMessage(`Hey ${firstName}! I'm your PaceForge AI Coach. I know your training plan, your goals, and your profile. Ask me anything — workouts, pacing, nutrition, recovery, or just how you're feeling. I'm here to help you succeed! 💪`);
    }

    function addCoachMessage(text) {
      const win = document.getElementById("coachWindow");
      const row = document.createElement("div");
      row.className = "imessage-row imessage-row-left";
      const bubble = document.createElement("div");
      bubble.className = "imessage-bubble imessage-bubble-coach";
      bubble.innerHTML = text.replace(/\n/g, "<br/>");
      row.appendChild(bubble);
      win.appendChild(row);
      win.scrollTop = win.scrollHeight;
    }

    function addUserCoachMessage(text) {
      const win = document.getElementById("coachWindow");
      const row = document.createElement("div");
      row.className = "imessage-row imessage-row-right";
      const bubble = document.createElement("div");
      bubble.className = "imessage-bubble imessage-bubble-user";
      bubble.textContent = text;
      row.appendChild(bubble);
      win.appendChild(row);
      win.scrollTop = win.scrollHeight;
    }

    function addTypingIndicator() {
      const win = document.getElementById("coachWindow");
      const row = document.createElement("div");
      row.className = "imessage-row imessage-row-left";
      row.id = "coachTyping";
      row.innerHTML = `<div class="imessage-typing"><span></span><span></span><span></span></div>`;
      win.appendChild(row);
      win.scrollTop = win.scrollHeight;
    }

    async function sendCoachMessage() {
      const input = document.getElementById("coachInput");
      const sendBtn = document.getElementById("coachSendBtn");
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      addUserCoachMessage(message);
      input.disabled = true;
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const token = localStorage.getItem("token");
        const res = await fetch("/api/coach", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        document.getElementById("coachTyping")?.remove();

        if (!res.ok) throw new Error(data.error);

        addCoachMessage(data.reply);

        // ✅ HANDLE PLAN CHANGE WITH CONFIRMATION
        if (data.planChange) {
          pendingPlanChange = data.planChange;
          const { week, dayIndex, workout } = data.planChange;
          const dayNames = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
          const dayName = dayNames[dayIndex] || `Day ${dayIndex + 1}`;
          document.getElementById("modalMessage").textContent = `Week ${week} - ${dayName}:\n\n"${workout}"\n\nDo you want to approve this change?`;
          show("planChangeModal");
        }

        if (data.hasPR) showToast("🏆 New PR detected!", "Your coach logged it.");
        if (data.hasInjury) showToast("⚠️ Injury mentioned", "Your coach is adjusting recommendations.");

      } catch (err) {
        document.getElementById("coachTyping")?.remove();
        addCoachMessage("Sorry, I'm having trouble connecting right now. Try again in a moment.");
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    async function approvePlanChange() {
      hide("planChangeModal");
      if (!pendingPlanChange) return;

      const { week, dayIndex, workout, type } = pendingPlanChange;
      
      if (fullPlan && fullPlan.weeks) {
        const weekData = fullPlan.weeks.find(w => w.week === week);
        if (weekData && weekData.days[dayIndex]) {
          weekData.days[dayIndex].workout = workout;
          if (type) weekData.days[dayIndex].type = type;

          const token = localStorage.getItem("token");
          await fetch("/api/update-plan", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ weekNumber: week, dayIndex, newWorkout: workout, newType: type })
          });

          renderWeek(currentWeek);
          showToast("✅ Plan updated!", "Your training adjusted!");
          addCoachMessage("Perfect! I've updated your plan. Let's make this work! 💪");
        }
      }
      pendingPlanChange = null;
    }

    function rejectPlanChange() {
      hide("planChangeModal");
      addCoachMessage("No problem! Keeping your plan as is. Let me know if you need anything else!");
      pendingPlanChange = null;
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function show(id) { const el = document.getElementById(id); if(el) el.classList.remove("hidden"); }
    function hide(id) { const el = document.getElementById(id); if(el) el.classList.add("hidden"); }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.appendChild(document.createTextNode(String(text)));
      return d.innerHTML;
    }

    let toastTimer = null;
    function showToast(title, sub) {
      const toast = document.getElementById("toast");
      document.getElementById("toastTitle").textContent = title;
      document.getElementById("toastSub").textContent = sub;
      toast.classList.remove("hidden", "fade-out");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add("fade-out");
        setTimeout(() => toast.classList.add("hidden"), 350);
      }, 3000);
    }

    // ============================================================
    // INIT
    // ============================================================
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "signin.html";
  </script>

</body>
</html>
