<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build Your Plan — PaceForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230B0F14' stroke='%232F80FF' stroke-width='6'/><path d='M25 65 L40 35 L55 52 L70 25' stroke='%232F80FF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="onboarding-page">

  <!-- Phone frame -->
  <div class="onboarding-phone">

    <!-- Top bar -->
    <div class="imessage-topbar">
      <div class="imessage-avatar">🏃</div>
      <div class="imessage-contact">
        <span class="imessage-name">PaceForge Coach</span>
        <span class="imessage-status">Building your plan</span>
      </div>
      <div class="imessage-progress-wrap">
        <div class="imessage-progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- Chat window -->
    <main class="imessage-main" id="chatWindow"></main>

    <!-- Input bar -->
    <div class="imessage-inputbar">
      <input
        type="text"
        class="imessage-input"
        id="chatInput"
        placeholder="iMessage"
        autocomplete="off"
      />
      <button class="imessage-send" id="sendBtn" onclick="handleSend()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 15V3M9 3L4 8M9 3L14 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>

  <script>
    const userName = localStorage.getItem("userName") || "there";
    const firstName = userName.split(" ")[0];

    const questions = [
      { id: "sex", question: `Hey ${firstName}! I'm your PaceForge coach. I'm going to ask you a few questions so I can build the perfect training plan for you.\n\nFirst — what's your sex? (Male / Female / Prefer not to say)` },
      { id: "height", question: "What's your height? (e.g. 5'10\" or 178cm)" },
      { id: "weight", question: "What's your weight? (e.g. 160 lbs or 73 kg)" },
      { id: "bodyFat", question: "Do you know your approximate body fat %? (Type 'skip' if unsure)" },
      { id: "yearsRunning", question: "How many years have you been running? (e.g. Less than 1, 1-2, 3-5, 5+)" },
      { id: "weeklyMileage", question: "What's your typical weekly mileage right now? (e.g. 20 miles, or 'none' if just starting)" },
      { id: "favoriteDistance", question: "What's your favorite or most comfortable race distance? (e.g. 5K, 10K, Half Marathon, Marathon)" },
      { id: "recentPRs", question: "What are your recent race PRs? (e.g. 5K: 19:30 — type 'skip' if none)" },
      { id: "injuries", question: "Any injuries in the past 12 months? Describe briefly or type 'none'" },
      { id: "fitnessLevel", question: "How would you rate yourself as a runner? (Beginner / Intermediate / Advanced / Elite)" },
      { id: "currentPace", question: "What's your current easy run pace per mile? (e.g. 8:30 per mile)" },
      { id: "liftingStats", question: "Any lifting stats? Squat/bench/deadlift 1RM — type 'skip' if not applicable" },
      { id: "sleepHours", question: "How many hours of sleep do you get per night on average? (e.g. 7)" },
      { id: "stressLevel", question: "Daily stress level on a scale of 1-10? (1 = very calm, 10 = extremely stressed)" },
      { id: "nutrition", question: "How would you describe your nutrition? (Poor / Average / Good / Very structured)" },
      { id: "hydration", question: "What do you mostly drink during the day? (e.g. Water, soda, coffee, mix)" },
      { id: "daysPerWeek", question: "How many days per week can you train? (e.g. 4)" },
      { id: "trainingTypes", question: "What types of training are you willing to do? List any that apply: easy runs, long runs, tempo, intervals, hills, sprints, lifting, plyometrics, cross training" },
      { id: "injuryCaution", question: "Any body areas I should be cautious about? (e.g. knees, ankles, hips — or type 'none')" },
      { id: "gymAccess", question: "Do you have access to a gym? (Full gym / Basic equipment / Home only / No gym)" },
      { id: "rosner", question: `Now I need to find your running limiter — this helps me target your weakest link.\n\n👉 Take the Rosner Running Limiter Test:\nhttps://running-limiter-finder-216861655601.us-west1.run.app/\n\nCome back and tell me your result.` },
      { id: "goalDistance", question: "What race distance are you training for? (e.g. 5K, 10K, Half Marathon, Marathon, Ultra, or 'general fitness')" },
      { id: "goalTime", question: "What's your goal time? (e.g. sub 19:00 for 5K — type 'skip' if general fitness)" },
      { id: "raceDate", question: "When is your race? (e.g. June 15, 2025 — type 'skip' if no specific race)" },
      { id: "motivation", question: "How motivated are you right now on a scale of 1-10?" },
      { id: "environment", question: "Favorite running environment? (Road / Track / Trail / Treadmill / Mix)" },
      { id: "planStyle", question: "Last one! Do you prefer a structured plan or flexible AI-guided suggestions? (Structured / Flexible)" },
    ];

    let currentQuestion = 0;
    const answers = {};

    const chatWindow = document.getElementById("chatWindow");
    const chatInput  = document.getElementById("chatInput");
    const sendBtn    = document.getElementById("sendBtn");

    function updateProgress() {
      const pct = (currentQuestion / questions.length) * 100;
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function addCoachBubble(text) {
      const row = document.createElement("div");
      row.className = "imessage-row imessage-row-left";
      const bubble = document.createElement("div");
      bubble.className = "imessage-bubble imessage-bubble-coach";
      bubble.innerHTML = text
        .replace(/\n/g, "<br/>")
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" class="imessage-link">$1</a>');
      row.appendChild(bubble);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addUserBubble(text) {
      const row = document.createElement("div");
      row.className = "imessage-row imessage-row-right";
      const bubble = document.createElement("div");
      bubble.className = "imessage-bubble imessage-bubble-user";
      bubble.textContent = text;
      row.appendChild(bubble);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function handleSend() {
      const value = chatInput.value.trim();
      if (!value) return;
      chatInput.value = "";
      addUserBubble(value);
      answers[questions[currentQuestion].id] = value;
      currentQuestion++;
      updateProgress();
      if (currentQuestion >= questions.length) {
        finishQuiz();
      } else {
        setTimeout(() => {
          addCoachBubble(questions[currentQuestion].question);
          chatInput.focus();
        }, 500);
      }
    }

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    async function finishQuiz() {
      chatInput.disabled = true;
      sendBtn.disabled = true;
      addCoachBubble(`Amazing ${firstName}! Give me a moment while I build your personalized training plan... 🏃‍♂️`);

      const loadingRow = document.createElement("div");
      loadingRow.className = "imessage-row imessage-row-left";
      loadingRow.innerHTML = `<div class="imessage-typing"><span></span><span></span><span></span></div>`;
      chatWindow.appendChild(loadingRow);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const token = localStorage.getItem("token");
        const res = await fetch("/api/onboarding", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(answers)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        loadingRow.remove();
        addCoachBubble(`Your plan is ready ${firstName}! Let's get to work. 💪`);
        setTimeout(() => { window.location.href = "training.html"; }, 1500);
      } catch (err) {
        loadingRow.remove();
        addCoachBubble(`Sorry, something went wrong: ${err.message}. Please try again.`);
        chatInput.disabled = false;
        sendBtn.disabled = false;
      }
    }

    updateProgress();
    setTimeout(() => {
      addCoachBubble(questions[0].question);
      chatInput.focus();
    }, 400);
  </script>

</body>
</html>
